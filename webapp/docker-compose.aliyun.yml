services:
  guess-word:
    build:
      context: .
      dockerfile: Dockerfile.aliyun
    image: guess-word:latest
    container_name: guess-word
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:3000"
    volumes:
      - guess-word-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true

volumes:
  guess-word-data:
