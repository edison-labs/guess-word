services:
  guess-word:
    image: ${ACR_IMAGE:?Set ACR_IMAGE to an immutable Aliyun ACR image tag}
    container_name: guess-word
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_HOST_PORT:-80}:3000"
    volumes:
      - guess-word-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true

volumes:
  guess-word-data:
